spring:
  datasource:
    # Testcontainers가 런타임에 오버라이드 — 실제 값은 @DynamicPropertySource로 주입
    url: jdbc:mariadb://localhost:3306/backup_test
    username: test
    password: test
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: false   # AbstractIT 정적 블록에서 직접 실행

backup:
  storage:
    incoming-root: ${java.io.tmpdir}/backup-test/incoming
    artifacts-root: ${java.io.tmpdir}/backup-test/artifacts
    trash-root: ${java.io.tmpdir}/backup-test/trash
  session:
    ttl-hours: 1
  auth:
    jwt-secret: test-secret-for-unit-tests-only-32chars!
  admin:
    key: test-admin-key

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    me.desair.tus: WARN
    com.intocns.backup: DEBUG
