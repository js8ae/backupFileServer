spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 30

backup:
  storage:
    incoming-root: ${BACKUP_INCOMING_ROOT}
    artifacts-root: ${BACKUP_ARTIFACTS_ROOT}
    trash-root: ${BACKUP_TRASH_ROOT}
  auth:
    jwt-secret: ${BACKUP_JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    me.desair.tus: WARN
    com.intocns.backup: INFO
