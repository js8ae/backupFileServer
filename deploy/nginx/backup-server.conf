upstream backup_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 8282 ssl;
    server_name backup.intocns.com;

    ssl_certificate     /etc/ssl/intocns_20250825/_wildcard_.intocns.com_20250825E2762.all.crt.pem;
    ssl_certificate_key /etc/ssl/intocns_20250825/_wildcard_.intocns.com_20250825E2762.key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 대용량 파일 업로드 — 제한 없음 (TUS가 청크 단위로 처리)
    client_max_body_size 0;

    # 청크 스트리밍: 요청 버퍼링 비활성화 필수
    proxy_request_buffering off;

    # 업로드 세션이 24시간이므로 충분히 길게 설정
    proxy_read_timeout  86400s;
    proxy_send_timeout  86400s;
    proxy_connect_timeout 10s;

    # 프록시 공통 헤더
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # /files/** — TUS 업로드 엔드포인트
    location /files {
        proxy_pass http://backup_app;
    }

    # /auth/** — 토큰 발급
    location /auth {
        proxy_pass http://backup_app;
    }

    # /actuator/health — 헬스체크 (내부망에서만 허용)
    location /actuator/health {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backup_app;
    }

    # /actuator/prometheus — Prometheus 스크레이핑 (내부망에서만 허용)
    location /actuator/prometheus {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backup_app;
    }

    # 그 외 actuator 엔드포인트 차단
    location /actuator {
        deny all;
    }

    # 기본 — swagger-ui, v3/api-docs 등 나머지 모든 경로를 백엔드로 전달
    location / {
        proxy_pass http://backup_app;
    }

    # 기본 접근 로그
    access_log /var/log/nginx/backup-server.access.log;
    error_log  /var/log/nginx/backup-server.error.log warn;
}
